[project]
name = "flight-tracker"
version = "1.0.0"
description = "Track flight prices from Israel (TLV) and get alerted on deals - FastAPI backend + web UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
desktop = ["plyer>=2.1"]

[project.scripts]
flight-tracker = "flight_tracker.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flight_tracker"]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH", "TC",
    "ASYNC", "RUF", "PL", "PT", "ANN", "S", "DTZ", "ERA", "FBT",
]
ignore = [
    "S101",    # assert is fine in tests
    "S311",    # random is used for demo data, not crypto
    "DTZ005",  # local "now" is intended for the scheduler / mock data
    "DTZ011",  # date.today() is intended (user's local calendar)
    "DTZ007",  # provider timestamps are local airport times (naive by design)
    "PLR2004", # magic values are readable here
    "RUF001", "RUF002", "RUF003",  # Hebrew text
    "TC001", "TC002", "TC003",     # pydantic/FastAPI need runtime types
    "FBT001", "FBT002",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S", "PLR"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["flight_tracker"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["apscheduler.*", "plyer.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
